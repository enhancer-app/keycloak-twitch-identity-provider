name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew clean verify --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
      - run: sha256sum build/libs/keycloak-twitch.jar > build/libs/keycloak-twitch.jar.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/keycloak-twitch.jar
            build/libs/keycloak-twitch.jar.sha256
